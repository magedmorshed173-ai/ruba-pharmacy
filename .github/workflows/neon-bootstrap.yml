name: Neon Bootstrap
# v4.6.3 — تهيئة Neon ذاتية الكفاية من مفتاح API وحده (بلا سلاسل اتصال جاهزة):
# يجد المشروع أو ينشئه، ينتظر جاهزية نقطة النهاية، يستخرج السلسلتين ويخفيهما
# (::add-mask:: — السجل عمومي)، يطبق الترحيلات، يبذر حسب الوضع، ثم يضمن
# حساب مدير من سر RUBA_ADMIN_PASSWORD — إغلاق فجوة «قاعدة بلا حساب دخول».
# الاستخدام: Actions ← Neon Bootstrap ← Run workflow:
#   catalog — إنتاج نظيف: ترحيلات + كتالوج + سجل وطني + حساب مدير
#   full    — تجريبي كامل: مستخدمون/مخزون/مبيعات 30 يوماً + الكتالوج + المدير
# الفرق عن «Neon DB Setup»: هذا يعمل بسر NEON_API_KEY فقط ولا يحتاج إدخال
# سلاسل الاتصال يدوياً — يشتقها من مفتاح الإدارة داخل العدّاء.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "وضع التهيئة"
        required: true
        default: "catalog"
        type: choice
        options: [catalog, full]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: حارس المفتاح
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "::error::سر NEON_API_KEY غير مضبوط — خذه من console.neon.tech → Account → API Keys ثم: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "::add-mask::$NEON_API_KEY"

      - name: تشخيص شبكة — أي مكدس DNS يصل إلى Neon؟
        run: |
          echo "getent:   $(getent hosts api.neon.tech | head -1 || echo FAIL)"
          echo "curl:     $(curl -s -o /dev/null -w '%{http_code}' --max-time 8 https://api.neon.tech/v2 || echo FAIL)"
          echo "node:     $(node -e "fetch('https://api.neon.tech/v2').then(r=>console.log(r.status)).catch(e=>{console.error(e.cause?.code||e.message);process.exit(1)})" || echo FAIL)"

      - name: حلّ المشروع وسلسلتي الاتصال (مخفيتين — curl/python متجنباً DNS الخاص بـ bun)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_NAME: ruba-pharmacy
        run: python3 scripts/neon_resolve.py

      - name: تثبيت الاعتماديات
        run: bun install --frozen-lockfile

      - name: توليد عميل Prisma
        run: bunx prisma generate

      - name: تنفيذ الترحيلات
        run: bunx prisma migrate deploy

      - name: بذر كامل تجريبي (وضع full)
        if: ${{ inputs.mode == 'full' }}
        run: |
          bun scripts/seed.ts
          bun scripts/seed-drugs.ts
          bun scripts/seed-national.ts

      - name: بذر الكتالوج والسجل الوطني (وضع catalog)
        if: ${{ inputs.mode == 'catalog' }}
        run: |
          bun scripts/seed-drugs.ts
          bun scripts/seed-national.ts

      - name: ضمان حساب المدير (كلمة مرور السر — لا تُطبع)
        env:
          RUBA_ADMIN_PASSWORD: ${{ secrets.RUBA_ADMIN_PASSWORD }}
        run: |
          [ -n "$RUBA_ADMIN_PASSWORD" ] && echo "::add-mask::$RUBA_ADMIN_PASSWORD"
          bun scripts/seed-admin.ts

      - name: حالة الترحيلات النهائية
        run: bunx prisma migrate status

      - name: تحقق حي — عدّ الجداول والعدّادات
        run: bun scripts/db-verify-live.ts

      # ── v4.6.4 — إغلاق الحلقة: رفع متغيرات Vercel الثلاثة وإطلاق نشر الإنتاج ──
      # وضع catalog حصراً (إنتاج نظيف). المتغيرات تُرفع مشفّرة على
      # production+preview+development، وAUTH_SECRET يولَّد هنا ولا يُطبع،
      # ثم يُطلق نشر من main عبر API — كل ذلك بلا أي قيمة في السجلات.
      - name: ربط Vercel — المتغيرات الثلاثة ثم إطلاق نشر الإنتاج (وضع catalog)
        if: ${{ inputs.mode == 'catalog' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::سر VERCEL_TOKEN غير مضبوط — Vercel → Account Settings → Tokens ثم: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "::add-mask::$VERCEL_TOKEN"
          AUTH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$AUTH_SECRET"
          export AUTH_SECRET
          python3 scripts/vercel_wire.py
