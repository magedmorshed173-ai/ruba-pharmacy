name: CI

# v4.5 (P1) — بوابة الجودة الآلية:
# كل ضغطة إلى main وكل طلب دمج يمر عبر: أنواع TypeScript → الاختبارات → بناء الإنتاج
# الفشل في أي مرحلة يمنع الدمج — تُسكّر باب الديون الصامتة نهائياً.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # قيم بناء فقط — لا قاعدة حية في CI: الاختبارات وحدة نقية،
      # والبناء لا يتصل بالقاعدة (الصفحات تستهلك الـ API من المتصفح)
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-build-secret-not-used-at-runtime-0123456789"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: تثبيت الاعتماديات
        run: bun install --frozen-lockfile

      - name: توليد عميل Prisma
        run: bunx prisma generate

      - name: فحص الأنواع (صفر تسامح)
        run: bunx tsc --noEmit

      - name: الفحص الأسلوبي
        run: bun run lint

      - name: الاختبارات
        run: bun run test

      - name: بناء الإنتاج (بفحص أنواع مفعل)
        run: bun run build
