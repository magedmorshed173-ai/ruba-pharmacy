name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: file:./db/ci.db

      # الاختبارات الحية (v4.3): خادم إنتاجي حقيقي + فرع Neon مؤقت + HTTP فعلي
      # بلا أسرار Neon يتخطى الجناح بلطف (exit 0) — لتفعيله أضف أسرار الريبو:
      #   NEON_API_KEY + NEON_PROJECT_ID + NEON_PARENT_DATABASE_URL (رابط مباشر للأصل)
      #   (+ NEON_PARENT_POOLED_URL اختيارياً — وإلا يُشتق من المباشر)
      - name: Live E2E suite (real server, real DB)
        run: bun run test:e2e
        env:
          AUTH_SECRET: ci-e2e-secret-not-for-production
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_DATABASE_URL: ${{ secrets.NEON_PARENT_DATABASE_URL }}
          NEON_PARENT_POOLED_URL: ${{ secrets.NEON_PARENT_POOLED_URL }}
